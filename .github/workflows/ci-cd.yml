name: CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  cloudflare-preview:
    name: Cloudflare Preview
    # Pushes to development, and PRs opened against main, both get a
    # throwaway preview URL. Production traffic is untouched.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/development'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Uploads a new Worker version without shifting production traffic;
      # Cloudflare returns a per-version preview URL.
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Summarize preview URL
        run: |
          echo "Cloudflare preview: ${{ steps.preview.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY

  cloudflare-production:
    name: Cloudflare Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summarize deployment URL
        run: |
          echo "Cloudflare production: ${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
